apiVersion: 1
datasources:
- name: PostgreSQL-postgres
  type: postgres
  access: proxy
  url: postgres:5432
  database: postgres
  user: postgres
  secureJsonData:
    password: postgres
  jsonData:
    sslmode: disable
    postgresVersion: 1400
  editable: true
- name: Prometheus
  type: prometheus
  access: proxy
  url: http://prometheus:9090
  isDefault: false
  editable: true
