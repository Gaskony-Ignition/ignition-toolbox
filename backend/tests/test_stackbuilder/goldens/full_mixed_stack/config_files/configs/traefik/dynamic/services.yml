http:
  routers:
    ignition-router:
      rule: Host(`ignition.localhost`)
      service: ignition
      entryPoints:
      - web
    keycloak-router:
      rule: Host(`keycloak.localhost`)
      service: keycloak
      entryPoints:
      - web
    grafana-router:
      rule: Host(`grafana.localhost`)
      service: grafana
      entryPoints:
      - web
    prometheus-router:
      rule: Host(`prometheus.localhost`)
      service: prometheus
      entryPoints:
      - web
    nodered-router:
      rule: Host(`nodered.localhost`)
      service: nodered
      entryPoints:
      - web
    mailhog-router:
      rule: Host(`mailhog.localhost`)
      service: mailhog
      entryPoints:
      - web
  services:
    ignition:
      loadBalancer:
        servers:
        - url: http://ignition:8088
    keycloak:
      loadBalancer:
        servers:
        - url: http://keycloak:8080
    grafana:
      loadBalancer:
        servers:
        - url: http://grafana:3000
    prometheus:
      loadBalancer:
        servers:
        - url: http://prometheus:9090
    nodered:
      loadBalancer:
        servers:
        - url: http://nodered:1880
    mailhog:
      loadBalancer:
        servers:
        - url: http://mailhog:8025
