name: iiot-stack
services:
  ignition:
    image: inductiveautomation/ignition:latest
    container_name: iiot-stack-ignition
    networks:
    - iiot-stack-network
    restart: unless-stopped
    ports:
    - 8088:8088
    - 8043:8043
    environment:
      ACCEPT_IGNITION_EULA: Y
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD: password
      IGNITION_EDITION: standard
      IGNITION_MEMORY_MAX: 2048m
      IGNITION_MEMORY_INIT: 512m
      TZ: UTC
      GATEWAY_SMTP_HOST: mailhog
      GATEWAY_SMTP_PORT: '1025'
      GATEWAY_SMTP_FROM: noreply@iiot.local
    volumes:
    - ignition-data:/usr/local/bin/ignition/data
    labels:
    - traefik.enable=true
    - traefik.http.routers.ignition.rule=Host(`ignition.localhost`)
    - traefik.http.routers.ignition.entrypoints=web
    - traefik.http.services.ignition.loadbalancer.server.port=8088
    depends_on:
      mosquitto:
        condition: service_started
  postgres:
    image: postgres:latest
    container_name: iiot-stack-postgres
    networks:
    - iiot-stack-network
    restart: unless-stopped
    ports:
    - 5432:5432
    environment:
      POSTGRES_DB: iiot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    volumes:
    - postgres-data:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: iiot-stack-keycloak
    networks:
    - iiot-stack-network
    restart: unless-stopped
    ports:
    - 8180:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      TZ: UTC
      KC_SMTP_HOST: mailhog
      KC_SMTP_PORT: '1025'
      KC_SMTP_FROM: noreply@iiot.local
    volumes:
    - keycloak-data:/opt/keycloak/data
    - ./configs/keycloak/import:/opt/keycloak/data/import:ro
    command: start-dev --import-realm
    labels:
    - traefik.enable=true
    - traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)
    - traefik.http.routers.keycloak.entrypoints=web
    - traefik.http.services.keycloak.loadbalancer.server.port=8080
    depends_on:
      postgres:
        condition: service_started
  traefik:
    image: traefik:latest
    container_name: iiot-stack-traefik
    networks:
    - iiot-stack-network
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    - 8080:8080
    environment:
      TZ: UTC
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    - ./configs/traefik/dynamic:/etc/traefik/dynamic:ro
  grafana:
    image: grafana/grafana:latest
    container_name: iiot-stack-grafana
    networks:
    - iiot-stack-network
    restart: unless-stopped
    ports:
    - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      TZ: UTC
      GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: NORMALIZED_SECRET
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://keycloak:8080/realms/iiot/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/iiot/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/iiot/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: 'true'
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: mailhog:1025
      GF_SMTP_FROM_ADDRESS: noreply@iiot.local
      GF_SMTP_FROM_NAME: Grafana
      GF_SMTP_SKIP_VERIFY: 'true'
    volumes:
    - grafana-data:/var/lib/grafana
    labels:
    - traefik.enable=true
    - traefik.http.routers.grafana.rule=Host(`grafana.localhost`)
    - traefik.http.routers.grafana.entrypoints=web
    - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on:
      postgres:
        condition: service_started
      keycloak:
        condition: service_started
      prometheus:
        condition: service_started
  prometheus:
    image: prom/prometheus:latest
    container_name: iiot-stack-prometheus
    networks:
    - iiot-stack-network
    restart: unless-stopped
    ports:
    - 9090:9090
    environment:
      TZ: UTC
    volumes:
    - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data:/prometheus
    labels:
    - traefik.enable=true
    - traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)
    - traefik.http.routers.prometheus.entrypoints=web
    - traefik.http.services.prometheus.loadbalancer.server.port=9090
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: iiot-stack-mosquitto
    networks:
    - iiot-stack-network
    restart: unless-stopped
    ports:
    - 1883:1883
    - 9001:9001
    environment:
      TZ: UTC
    volumes:
    - mosquitto-data:/mosquitto/data
    - mosquitto-log:/mosquitto/log
    - ./configs/mosquitto:/mosquitto/config:ro
  nodered:
    image: nodered/node-red:latest
    container_name: iiot-stack-nodered
    networks:
    - iiot-stack-network
    restart: unless-stopped
    ports:
    - 1880:1880
    environment:
      TZ: UTC
    volumes:
    - nodered-data:/data
    labels:
    - traefik.enable=true
    - traefik.http.routers.nodered.rule=Host(`nodered.localhost`)
    - traefik.http.routers.nodered.entrypoints=web
    - traefik.http.services.nodered.loadbalancer.server.port=1880
  mailhog:
    image: mailhog/mailhog:latest
    container_name: iiot-stack-mailhog
    networks:
    - iiot-stack-network
    restart: unless-stopped
    ports:
    - 1025:1025
    - 8025:8025
    environment:
      TZ: UTC
    volumes: []
    labels:
    - traefik.enable=true
    - traefik.http.routers.mailhog.rule=Host(`mailhog.localhost`)
    - traefik.http.routers.mailhog.entrypoints=web
    - traefik.http.services.mailhog.loadbalancer.server.port=8025
networks:
  iiot-stack-network:
    driver: bridge
volumes:
  grafana-data: null
  ignition-data: null
  keycloak-data: null
  mosquitto-data: null
  mosquitto-log: null
  nodered-data: null
  postgres-data: null
  prometheus-data: null
