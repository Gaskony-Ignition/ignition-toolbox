name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Check version consistency
        run: python scripts/check-versions.py

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install Python dev dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Build Electron
        run: npm run build:electron

      - name: Build Frontend
        run: npm run build:frontend

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Validate playbook schemas
        run: python scripts/validate-playbooks.py

      - name: Run frontend tests
        run: |
          cd frontend
          npx vitest run

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Python dev dependencies
        run: |
          cd backend
          # Pinned deliberately: formatting is version-sensitive, so an
          # unpinned upgrade would fail black --check on code nobody touched.
          # Bump these together with a reformat commit, never on their own.
          pip install ruff==0.15.18 black==26.5.1

      - name: Lint frontend
        run: |
          cd frontend
          npx eslint src/ --max-warnings 0

      - name: Lint Python (ruff)
        run: |
          cd backend
          python -m ruff check ignition_toolkit/ tests/

      - name: Check Python formatting (black)
        run: |
          cd backend
          python -m black --check ignition_toolkit/ tests/
